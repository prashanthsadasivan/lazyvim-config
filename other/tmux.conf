set-option -g default-terminal "tmux-256color"
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 100000
set-option -g focus-events on
#set-option -g default-command "reattach-to-user-namespace -l zsh"

# use VI
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi PPage send -X halfpage-up
bind-key -T copy-mode-vi NPage send -X halfpage-down

# Use ctrl-e instead of ctrl-b
set -g prefix C-e
unbind C-b
bind C-e send-prefix

unbind C-f
bind C-f command-prompt "switch-client -t %%"

# kill
unbind k
bind k confirm-before "kill-window"

unbind ^x
bind ^x kill-pane

# reload config
unbind R
bind R source-file ~/.tmux.conf

unbind ^T
bind ^T split-window -p 25

# tile all windows
unbind =
bind = select-layout tiled

# resize panes
unbind +
bind + resize-pane -Z
unbind -
bind - resize-pane -Z

# status bar
set -g base-index 1
set -g status-bg black
set -g status-fg colour245
set -g status-interval 1

set -g status-left ' '
set -g status-right '#[fg=colour180]%Y-%m-%d %H:%M#[default] '

# Per-tab colors (active = bright, inactive = default grey)
set -g window-status-current-format \
  '#{?#{==:#{window_index},1},#[fg=colour204],#{?#{==:#{window_index},2},#[fg=colour114],#{?#{==:#{window_index},3},#[fg=colour214],#{?#{==:#{window_index},4},#[fg=colour75],#{?#{==:#{window_index},5},#[fg=colour183],#{?#{==:#{window_index},6},#[fg=colour117],#{?#{==:#{window_index},7},#[fg=colour218],#[fg=colour228]}}}}}}}#[bg=colour236,bold] #I:#W #[default]'

set -g window-status-format \
  '#{?#{==:#{window_index},1},#[fg=colour131],#{?#{==:#{window_index},2},#[fg=colour65],#{?#{==:#{window_index},3},#[fg=colour172],#{?#{==:#{window_index},4},#[fg=colour67],#{?#{==:#{window_index},5},#[fg=colour133],#{?#{==:#{window_index},6},#[fg=colour73],#{?#{==:#{window_index},7},#[fg=colour175],#[fg=colour186]}}}}}}}#{?#{window_activity_flag},#[bold] *#I:#W,  #I:#W} #[default]'

set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M


# Pane mappings (Will work with Mac only if option key is meta, see readme)

set -sg escape-time 0

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind-key -nr    M-Up resize-pane -U
bind-key -nr  M-Down resize-pane -D
bind-key -nr  M-Left resize-pane -L
bind-key -nr M-Right resize-pane -R

bind-key -n M-PPage copy-mode -u

bind-key -n C-u copy-mode
bind-key -n M-i paste-buffer

bind-key -n M-d detach-client

bind-key -n M-8 choose-session
bind-key -n M-9 switch-client -p
bind-key -n M-0 switch-client -n

# auto renumber windows
set-option -g renumber-windows on

# Window switching (works in both normal and remote passthrough mode)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-h previous-window
bind-key -n M-l next-window
# Re-order windows left and right
bind-key -n M-H swap-window -t -1\; select-window -t -1
bind-key -n M-L swap-window -t +1\; select-window -t +1

bind-key -T off M-1 select-window -t 1
bind-key -T off M-2 select-window -t 2
bind-key -T off M-3 select-window -t 3
bind-key -T off M-4 select-window -t 4
bind-key -T off M-5 select-window -t 5
bind-key -T off M-6 select-window -t 6
bind-key -T off M-7 select-window -t 7
bind-key -T off M-h previous-window
bind-key -T off M-l next-window

# Tab titles

setw -g monitor-activity on
set -g visual-activity off
set-window-option -g window-status-activity-style "default"

set -g set-titles on
set -g set-titles-string '#S: #W'
setw -g automatic-rename

unbind r
bind r swap-pane -U

# F12: toggle local/remote TMUX passthrough
# Press F12 to send all keys to the nested (remote) TMUX session.
# Press F12 again to reclaim keys for the local session.
# Status bar turns red when keys are being passed through.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-bg colour130 \;\
  set status-fg white \;\
  set status-left '#[fg=white] [REMOTE] ' \;\
  set status-right '#[fg=white]%Y-%m-%d %H:%M ' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set prefix C-e \;\
  set key-table root \;\
  set status-bg black \;\
  set status-fg colour245 \;\
  set status-left ' ' \;\
  set status-right '#[fg=colour180]%Y-%m-%d %H:%M#[default] ' \;\
  refresh-client -S
